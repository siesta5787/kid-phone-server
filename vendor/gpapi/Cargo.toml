# Vendored copy of gpapi 6.1.0 (https://github.com/EFForg/rs-google-play, MIT - see LICENSE).
# Changed from upstream: reqwest uses rustls (no native-tls/OpenSSL, which the server's
# aarch64-musl cross build doesn't have), and the tokio-dl-stream-to-disk dependency is gone
# along with gpapi's own download(); its HTTP client doesn't reuse connections and has timeouts;
# and its Error reports its cause - see the note at the top of src/lib.rs.
[package]
name = "gpapi"
version = "6.1.0"
edition = "2021"
license = "MIT"
description = "Google Play API (vendored for kid-phone-server)"
publish = false

[dependencies]
bincode = "2"
bytes = "1"
configparser = "3"
futures = "0.3"
googleplay-protobuf = "3"
prost = "0.14"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
bincode = "2"
bytes = "1"
configparser = "3"
googleplay-protobuf = "3"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
