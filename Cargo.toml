[package]
name = "kid_phone_server"
version = "0.18.3"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
argon2 = "0.5.3"
askama = "0.16.0"
axum = { version = "0.8.9", features = ["multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
form_urlencoded = "1"
hex = "0.4"
pbkdf2 = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json"] }
# Not used directly (dns_engine.rs no longer runs a live TLS/DoT listener) - still a direct
# dependency purely so main.rs can install a process-wide default CryptoProvider before anything
# opens a connection. reqwest's own "rustls" feature needs one installed somewhere, and there's no
# error at the call site if it's missing - see main.rs's comment and this repo's CLAUDE.md gotcha.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "chrono"] }
tokio = { version = "1.52.3", features = ["full"] }
totp-rs = { version = "5.7.2", features = ["gen_secret", "qr"] }
tower-http = { version = "0.7.0", features = ["fs", "set-header"] }
tower-sessions = "0.14"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
