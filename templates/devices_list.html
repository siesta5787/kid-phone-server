<!DOCTYPE html>
<html lang="en">
<head>
{% include "partials/head.html" %}
</head>
<body>
{% include "partials/app_header.html" %}
<main class="container">
    <div class="page-header">
        <h1>Devices</h1>
        <a href="/devices/new" class="button">Add a device</a>
    </div>

    {% if devices.is_empty() %}
    <p class="empty-state">No devices yet. Add one to get started.</p>
    {% else %}
    <div class="device-list">
        {% for d in devices %}
        <a class="device-card" href="/devices/{{ d.id }}">
            <span class="device-name">{{ d.name }}</span>
            <span class="device-status">{{ d.status_text }}</span>
        </a>
        {% endfor %}
    </div>
    {% endif %}
</main>
</body>
</html>
